syntax = "proto3";
package streamchat;
service ModelWorker {
  rpc Generate(GenerateRequest) returns (stream Chunk);
  rpc Ready(ReadyRequest) returns (ReadyReply);
}
message Message { string role = 1; string content = 2; }
message GenerateRequest {
  string run_id = 1;
  repeated Message messages = 2;
  uint32 max_tokens = 3;
}
message Chunk {
  string text = 1;
  bool done = 2;
  string finish_reason = 3;
}
message ReadyRequest {}
message ReadyReply { bool ready = 1; string model = 2; }
