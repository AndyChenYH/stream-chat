app = "stream-chat-andy"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  strategy = "immediate"

[env]
  ALLOWED_ORIGINS = "https://andychenyh.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
